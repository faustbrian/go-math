schema_version: 1
tool_version: v1.4.0
tool_checksums_sha256: ba1b71d41dc9b58d5bfb411bc89ae2d45b6f3f778152714bfd1afeab0bef2f33
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
mutation:
  root: ".verification/mutation"
  imports:
  - module: "."
    archive: ".verification/mutation/bootstrap/root.zip"
    ledger: ".verification/mutation/migration-ledger.json"
operations:
- module: "."
  gate: conformance
  steps:
  - type: go-test
    packages: ["./decimal"]
    run: '^(TestGeneralDecimalArithmeticVectors|TestDecimalDifferentialAgainstAPDAndShopspring)$'
    count: 1
    timeout: 20m
- module: "."
  gate: test
  steps:
  - type: make
    makefile: verification/package.mk
    target: architecture
    timeout: 20m
  - type: make
    makefile: verification/package.mk
    target: provenance
    timeout: 20m
- module: "."
  gate: docs
  steps:
  - type: make
    makefile: verification/package.mk
    target: docs
    timeout: 20m
- module: "."
  gate: api
  steps:
  - type: make
    makefile: verification/package.mk
    target: api
    timeout: 20m
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages: ["./integer"]
    fuzz: '^FuzzParseAndArithmetic$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["./rational"]
    fuzz: '^FuzzParseRoundTrip$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["./decimal"]
    fuzz: '^FuzzParseContextAndRoundTrip$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["./decimal"]
    fuzz: '^FuzzJSONDecoding$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["./bigfloat"]
    fuzz: '^FuzzParse$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["./encoding"]
    fuzz: '^FuzzBinaryDecoders$'
    budget: 2s
    timeout: 2m
- module: "."
  gate: benchmark
  steps:
  - type: go-test
    packages: ["./..."]
    benchmark: "Benchmark"
    budget: 100ms
    timeout: 20m
