schema_version: 1
tool_version: v1.8.5
tool_checksums_sha256: 57f81a14b32fa629f9ed5c9cc6edc62c171095f5da6e36fa989dc12442fe1983
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
mutation:
  root: ".verification/mutation"
  imports:
  - module: "."
    archive: ".verification/mutation/bootstrap/root.zip"
    ledger: ".verification/mutation/migration-ledger.json"
api:
  baselines:
  - module: "."
    mode: apidiff
    path: api/baseline.txt
operations:
- module: "."
  gate: conformance
  steps:
  - type: make
    makefile: verification/package.mk
    target: api
    timeout: 20m
  - type: go-test
    packages: ["./decimal"]
    run: '^(TestGeneralDecimalArithmeticVectors|TestDecimalDifferentialAgainstAPDAndShopspring)$'
    count: 1
    timeout: 20m
- module: "."
  gate: test
  steps:
  - type: make
    makefile: verification/package.mk
    target: architecture
    timeout: 20m
  - type: make
    makefile: verification/package.mk
    target: provenance
    timeout: 20m
- module: "."
  gate: docs
  steps:
  - type: make
    makefile: verification/package.mk
    target: docs
    timeout: 20m
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages: ["./integer"]
    fuzz: '^FuzzParseAndArithmetic$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["./rational"]
    fuzz: '^FuzzParseRoundTrip$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["./decimal"]
    fuzz: '^FuzzParseContextAndRoundTrip$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["./decimal"]
    fuzz: '^FuzzJSONDecoding$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["./bigfloat"]
    fuzz: '^FuzzParse$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["./encoding"]
    fuzz: '^FuzzBinaryDecoders$'
    budget: 10000x
    timeout: 2m
- module: "."
  gate: benchmark
  steps:
  - type: go-test
    packages: ["./..."]
    benchmark: "Benchmark"
    budget: 100ms
    timeout: 20m
